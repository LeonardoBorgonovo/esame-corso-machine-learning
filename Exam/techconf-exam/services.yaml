services:
  # ------------------------------- mandatory -------------------------------
  user:
    cwd: services/user-service
    command: python run.py
    health_path: /health

  event:
    cwd: services/event-service
    command: python run.py
    health_path: /health

  registration:
    cwd: services/registration-service
    command: python run.py
    health_path: /health

  # ------------------------------- optional --------------------------------
  feedback:
    cwd: services/feedback-service
    command: python run.py
    health_path: /health

  notification:
    cwd: services/notification-service
    command: python run.py
    health_path: /health
